<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena</title>
<style>
:root{--bg:#fff;--cd:#fff;--ln:#E4E4E7;--tx:#09090B;--mu:#52525B;--ink:#09090B;--on:#fff;--gold:#A16207;--red:#DC2626;--grn:#15803D;--c0:#09090B;--c1:#DC2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090B;--cd:#18181B;--ln:#3F3F46;--tx:#FAFAFA;--mu:#A1A1AA;--ink:#FAFAFA;--on:#09090B;--gold:#FACC15;--red:#F87171;--grn:#4ADE80;--c0:#FAFAFA;--c1:#F87171}}
:root[data-theme="dark"]{--bg:#09090B;--cd:#18181B;--ln:#3F3F46;--tx:#FAFAFA;--mu:#A1A1AA;--ink:#FAFAFA;--on:#09090B;--gold:#FACC15;--red:#F87171;--grn:#4ADE80;--c0:#FAFAFA;--c1:#F87171}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--ln);gap:6px}
.logo{font-weight:900;font-size:20px;letter-spacing:2px}
main{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
nav{display:flex;border-top:1px solid var(--ln)}nav button{flex:1;min-height:52px;background:none;border:0;color:var(--mu);font-size:12px;font-weight:600}nav button.on{color:var(--tx);border-top:2px solid var(--ink)}
.c{border:1px solid var(--ln);background:var(--cd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.w{flex-wrap:wrap}.m{color:var(--mu);font-size:12px}.b{font-weight:700}.f1{flex:1}
button,select,input,textarea{font:inherit;color:var(--tx)}
.chip{border:1px solid var(--ln);background:none;border-radius:999px;padding:6px 12px;min-height:40px;font-size:13px}.chip.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.btn{border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;background:var(--ink);color:var(--on)}.btn.o{background:none;border:1px solid var(--ln);color:var(--tx)}.btn.gd{background:var(--gold);color:#fff}.btn.rd{background:var(--red);color:#fff}.btn:disabled{opacity:.4}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;min-height:44px;width:100%}
.live{color:var(--red);font-weight:800;font-size:11px}.win{color:var(--grn);font-weight:700}.gold{color:var(--gold);font-weight:800}
.mv{width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:8px;display:block}.ph{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:#fff;background:#27272A;font-weight:600;border-radius:8px}
.cm{padding:6px 0;border-top:1px solid var(--ln)}
.meter{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--ln)}.meter i{display:block;transition:width .4s}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.ov>.c{width:100%;max-width:460px;max-height:92%;overflow:auto}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:9px 14px;border-radius:999px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center}
.bars{display:flex;align-items:flex-end;gap:6px;height:60px}.bars i{flex:1;background:var(--ink);border-radius:3px 3px 0 0;min-height:3px}
.auth{max-width:420px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:12px}
</style></head><body>
<div id="app"><header id="hd"></header><main id="v"></main><nav id="nav"></nav></div>
<div id="toast"></div><div id="ovl"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FR={'Battles':'Battles','Feed':'Fil','Search':'Recherche','Me':'Moi','Dance':'Danse','Singing':'Chant','Debate':'Débat','Comedy':'Humour','Roast':'Clash','Follow race':'Course aux abonnés','Video':'Vidéo','Photo':'Photo','Open-mic':'Micro ouvert','Voting coins':'Pièces de vote','Reward coins':'Pièces de récompense','Log in':'Connexion','Sign up':'Créer un compte','Name':'Nom','Email':'E-mail','Password':'Mot de passe','Or continue with':'Ou continuer avec','Welcome':'Bienvenue','Log out':'Se déconnecter','Language':'Langue','Not enough coins':'Pas assez de pièces','Virtual coins only. No cash value, no withdrawal.':'Pièces virtuelles uniquement. Aucune valeur monétaire, aucun retrait.','Fill all fields':'Remplissez tous les champs','Invalid email':'E-mail invalide','Password needs 6+ characters':'Mot de passe : 6 caractères min.','Upload':'Publier','Post':'Publier','Title':'Titre','Description':'Description','Free':'Gratuit','Free download':'Téléchargement gratuit','Paid':'Payant','Follow-to-unlock':'Débloqué en suivant','Choose a file and a title':'Choisissez un fichier et un titre','File too large (max 50 MB)':'Fichier trop lourd (50 Mo max)','Photo or video only':'Photo ou vidéo uniquement','Uploading...':'Envoi en cours...','Published':'Publié','Follow':'Suivre','Following':'Suivi','Follow to unlock':'Suivre pour débloquer','Unlock':'Débloquer','Download':'Télécharger','Delete':'Supprimer','Comment':'Commenter','Write a comment':'Écrire un commentaire','Refresh':'Actualiser','Nothing here yet. Be the first to post.':'Rien ici pour le moment. Soyez le premier à publier.','Locked':'Verrouillé','Spend coins to unlock this':'Dépensez des pièces pour débloquer','Follow the creator to unlock this':'Suivez le créateur pour débloquer','Search creators, posts, battles':'Chercher créateurs, posts, battles','Creators':'Créateurs','Posts':'Posts','No results':'Aucun résultat','Create battle':'Créer un battle','Create':'Créer','Host':'Hôte','Waiting for challenger':'En attente d\'un challenger','Join as contender':'Rejoindre comme battler','Reward pool':'Cagnotte virtuelle','20% host · 80% battlers':'20 % hôte · 80 % battlers','SuperVote':'SuperVote','Like boost':'Boost « J\'aime »','End battle and pay rewards':'Terminer et verser les récompenses','Watch / go live':'Regarder / passer en direct','No battles yet. Create the first one.':'Aucun battle. Créez le premier.','Winner':'Gagnant','Close':'Fermer','Back':'Retour','Mute':'Couper le micro','Unmute':'Activer le micro','Camera':'Caméra','Leave':'Quitter','Monthly allowance':'Allocation mensuelle','Claim +100 voting coins':'Réclamer +100 pièces de vote','Already claimed this month':'Déjà réclamé ce mois-ci','Dashboard':'Tableau de bord','Coins earned':'Pièces gagnées','Content unlocks':'Déblocages de contenu','Battle performance':'Performance en battle','Played':'Joués','Wins':'Victoires','Followers':'Abonnés','Follower growth (7 days)':'Croissance des abonnés (7 jours)','Sales from unlocks':'Ventes (déblocages)','Reward history':'Historique des récompenses','No rewards yet.':'Aucune récompense.','My content':'Mon contenu','Setup needed':'Configuration requise','Confirm email sent. Check your inbox, then log in.':'E-mail de confirmation envoyé. Vérifiez votre boîte, puis connectez-vous.','Deleted':'Supprimé','Battle created':'Battle créé','Joined':'Rejoint','Rewards paid':'Récompenses versées','Already liked':'Déjà aimé','You cannot vote in your own battle':'Les contenders ne peuvent pas voter','Battle is not live yet':'Le battle n\'est pas encore en direct','Connected':'Connecté','Picks the side you vote for':'Touchez un battler pour le soutenir'};
const t=s=>S.lang=='fr'&&FR[s]||s;
const S={lang:'en',tab:'f',user:null,vc:0,rc:0,claimed:0,posts:[],likes:{},cmts:{},urls:{},fol:{},unl:{},battles:[],ent:{},bsel:null,side:{},q:'',sr:null,me:null,authTab:'login',busy:0};
try{const l=localStorage.getItem('arena-lang');if(l)S.lang=l;else if(/^fr/i.test(navigator.language))S.lang='fr'}catch(e){}
const CFG=window.ARENA_CONFIG||{};
const SB=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const CAT=[['dance','Dance'],['sing','Singing'],['debate','Debate'],['comedy','Comedy'],['roast','Roast'],['follow','Follow race']];
const cn=c=>t((CAT.find(x=>x[0]==c)||[0,c])[1]);
const emsg=e=>{const m=(e&&e.message)||String(e);if(/not_enough_coins/.test(m))return t('Not enough coins');if(/already_liked/.test(m))return t('Already liked');if(/contender_cannot_vote/.test(m))return t('You cannot vote in your own battle');if(/battle_not_live/.test(m))return t('Battle is not live yet');return m};
function toast(m){const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2400)}
const when=d=>new Date(d).toLocaleString(S.lang=='fr'?'fr-CA':'en-CA',{dateStyle:'medium',timeStyle:'short'});
const allPosts=()=>[...S.posts,...(S.sr?S.sr.posts:[])];
function hdr(){if(!S.user){$('#hd').innerHTML='';$('#nav').innerHTML='';return}
$('#hd').innerHTML=`<div class="logo">ARENA</div><div class="r"><button class="chip" data-a="lang">${S.lang.toUpperCase()}</button><div class="chip b" style="min-height:34px;padding:4px 10px" title="${t('Voting coins')}">V ${S.vc}</div><div class="chip b gold" style="min-height:34px;padding:4px 10px" title="${t('Reward coins')}">R ${S.rc}</div></div>`;
$('#nav').innerHTML=[['b','Battles'],['f','Feed'],['d','Search'],['p','Me']].map(([k,l])=>`<button class="${S.tab==k?'on':''}" data-a="tab" data-v="${k}">${t(l)}</button>`).join('')}
function auth(){if(!SB)return `<div class="auth"><div class="logo">ARENA</div><div class="c"><b>${t('Setup needed')}</b><div class="m">Fill in config.js (SUPABASE_URL and SUPABASE_ANON_KEY) and redeploy. See README.md.</div></div></div>`;
const su=S.authTab=='signup';return `<div class="auth"><div class="r sp"><div class="logo">ARENA</div><div class="r"><button class="chip ${S.lang=='en'?'on':''}" data-a="lang" data-v="en">EN</button><button class="chip ${S.lang=='fr'?'on':''}" data-a="lang" data-v="fr">FR</button></div></div>
<div class="r"><button class="chip f1 ${!su?'on':''}" data-a="at" data-v="login">${t('Log in')}</button><button class="chip f1 ${su?'on':''}" data-a="at" data-v="signup">${t('Sign up')}</button></div>
${su?`<input id="an" placeholder="${t('Name')}" autocomplete="name">`:''}<input id="ae" type="email" placeholder="${t('Email')}" autocomplete="email"><input id="ap" type="password" placeholder="${t('Password')}" autocomplete="current-password">
<button class="btn" data-a="authgo">${su?t('Sign up'):t('Log in')}</button><div class="m" style="text-align:center">${t('Or continue with')}</div>
<div class="r w">${['Google','Facebook'].map(p=>`<button class="btn o f1" data-a="social" data-v="${p}">${p}</button>`).join('')}</div><div class="m">${t('Virtual coins only. No cash value, no withdrawal.')}</div></div>`}
/* data loading */
async function loadProfile(){const{data,error}=await SB.rpc('my_profile');const p=Array.isArray(data)?data[0]:data;if(error||!p){toast('Profile error: '+(error?error.message:'missing'));return 0}
S.vc=p.voting_coins;S.rc=p.reward_coins;S.claimed=String(p.last_claim).slice(0,7)==new Date().toISOString().slice(0,7)?1:0;S.user={id:p.id,name:p.name};return 1}
async function loadSocial(){const[f,u]=await Promise.all([SB.from('follows').select('followee').eq('follower',S.user.id),SB.from('unlocks').select('post_id').eq('user_id',S.user.id)]);S.fol={};(f.data||[]).forEach(r=>S.fol[r.followee]=1);S.unl={};(u.data||[]).forEach(r=>S.unl[r.post_id]=1)}
const canView=p=>p.gate=='free'||p.user_id==S.user.id||(p.gate=='paid'&&S.unl[p.id])||(p.gate=='follow'&&S.fol[p.user_id]);
async function hydrate(posts){const ids=posts.map(p=>p.id);if(!ids.length)return;
const[l,c]=await Promise.all([SB.from('likes').select('post_id,user_id').in('post_id',ids),SB.from('comments').select('id,post_id,user_id,body,created_at,profiles!comments_user_id_fkey(name)').in('post_id',ids).order('created_at',{ascending:true})]);
ids.forEach(i=>{S.likes[i]=[];S.cmts[i]=[]});(l.data||[]).forEach(r=>S.likes[r.post_id]&&S.likes[r.post_id].push(r.user_id));(c.data||[]).forEach(r=>S.cmts[r.post_id]&&S.cmts[r.post_id].push(r));
const paths=posts.filter(canView).map(p=>p.file_path);if(paths.length){const{data}=await SB.storage.from('media').createSignedUrls(paths,3600);(data||[]).forEach(r=>{if(r.signedUrl)S.urls[r.path]=r.signedUrl})}}
async function loadFeed(){const{data,error}=await SB.from('posts').select('*,profiles!posts_user_id_fkey(name)').order('created_at',{ascending:false}).limit(40);if(error)return toast(error.message);S.posts=data||[];await hydrate(S.posts)}
async function loadBattles(){const{data}=await SB.from('battles').select('*,profiles!battles_host_id_fkey(name)').order('created_at',{ascending:false}).limit(30);S.battles=data||[];const ids=S.battles.map(b=>b.id);S.ent={};if(ids.length){const{data:e}=await SB.from('battle_entries').select('*,profiles!battle_entries_user_id_fkey(name)').in('battle_id',ids);(e||[]).forEach(r=>(S.ent[r.battle_id]=S.ent[r.battle_id]||[]).push(r))}}
async function loadMe(){const uid=S.user.id,since=new Date(Date.now()-6*864e5).toISOString().slice(0,10);
const[h,un,fo,fc,en]=await Promise.all([SB.from('reward_history').select('description,coins,created_at').order('created_at',{ascending:false}).limit(30),
SB.from('unlocks').select('post_id,posts!unlocks_post_id_fkey!inner(user_id)',{count:'exact',head:true}).eq('posts.user_id',uid),
SB.from('follows').select('created_at').eq('followee',uid).gte('created_at',since),SB.from('follows').select('follower',{count:'exact',head:true}).eq('followee',uid),
SB.from('battle_entries').select('battle_id,battles!battle_entries_battle_id_fkey(winner)').eq('user_id',uid)]);
const days=Array(7).fill(0);(fo.data||[]).forEach(r=>{const k=Math.floor((Date.now()-new Date(r.created_at))/864e5);if(k>=0&&k<7)days[6-k]++});
const hist=h.data||[];S.me={hist,earned:hist.reduce((a,x)=>a+x.coins,0),unlocks:un.count||0,followers:fc.count||0,days,played:(en.data||[]).length,wins:(en.data||[]).filter(r=>r.battles&&r.battles.winner==uid).length}}
async function boot(){if(!await loadProfile())return;await loadSocial();await Promise.all([loadFeed(),loadBattles()]);S.tab='f';render();toast(t('Welcome')+', '+S.user.name)}
/* feed */
function pc(p){const mine=p.user_id==S.user.id,ok=canView(p),u=S.urls[p.file_path],cm=S.cmts[p.id]||[],lk=S.likes[p.id]||[],nm=(p.profiles&&p.profiles.name)||'?';
const media=ok?(u?(p.kind=='video'?`<video class="mv" src="${esc(u)}" controls preload="metadata" playsinline></video>`:`<img class="mv" src="${esc(u)}" alt="${esc(p.title)}">`):`<div class="ph">…</div>`):`<div class="ph"><div>${t('Locked')}<br>${p.gate=='paid'?t('Spend coins to unlock this')+' ('+p.price+' V)':t('Follow the creator to unlock this')}</div></div>`;
const act=ok?`<button class="btn f1" data-a="dl" data-v="${p.id}">${t('Download')}</button>`:p.gate=='paid'?`<button class="btn gd f1" data-a="unlock" data-v="${p.id}">${t('Unlock')} · ${p.price} V</button>`:`<button class="btn gd f1" data-a="fol" data-v="${p.user_id}">${t('Follow to unlock')}</button>`;
return `<div class="c">${media}<div class="r sp"><b>${esc(p.title)}</b><span class="m">${p.gate=='paid'?p.price+' V':p.gate=='follow'?t('Follow-to-unlock'):t('Free')}</span></div>${p.description?`<div>${esc(p.description)}</div>`:''}<div class="m">${esc(nm)} · ${when(p.created_at)}</div>
<div class="r w"><button class="chip ${lk.includes(S.user.id)?'on':''}" data-a="like" data-v="${p.id}">♥ ${lk.length}</button>${mine?'':`<button class="chip ${S.fol[p.user_id]?'on':''}" data-a="fol" data-v="${p.user_id}">${S.fol[p.user_id]?t('Following'):t('Follow')}</button>`}${act}${mine?`<button class="chip" data-a="delpost" data-v="${p.id}">${t('Delete')}</button>`:''}</div>
${cm.map(c=>`<div class="cm"><b>${esc(c.profiles&&c.profiles.name||'?')}</b> <span class="m">${when(c.created_at)}</span><div>${esc(c.body)}</div>${(c.user_id==S.user.id||mine)?`<button class="chip" style="min-height:30px;font-size:11px" data-a="delc" data-v="${c.id}">${t('Delete')}</button>`:''}</div>`).join('')}
<div class="r"><input id="ci-${p.id}" maxlength="500" placeholder="${t('Write a comment')}"><button class="btn" data-a="cmt" data-v="${p.id}">${t('Comment')}</button></div></div>`}
function feed(){return `<div class="r"><button class="btn f1" data-a="up">+ ${t('Upload')}</button><button class="chip" data-a="refresh">${t('Refresh')}</button></div>`+(S.posts.length?S.posts.map(pc).join(''):`<div class="m">${t('Nothing here yet. Be the first to post.')}</div>`)}
/* search */
function disc(){const r=S.sr;return `<input id="q" placeholder="${t('Search creators, posts, battles')}" value="${esc(S.q)}" data-a="q">`+(!r?'':(`<b>${t('Creators')}</b>`+(r.users.map(u=>`<div class="c r sp"><span>${esc(u.name)}</span>${u.id==S.user.id?'':`<button class="chip ${S.fol[u.id]?'on':''}" data-a="fol" data-v="${u.id}">${S.fol[u.id]?t('Following'):t('Follow')}</button>`}</div>`).join('')||`<div class="m">${t('No results')}</div>`)+`<b>${t('Posts')}</b>`+(r.posts.map(pc).join('')||`<div class="m">${t('No results')}</div>`)+`<b>${t('Battles')}</b>`+(r.battles.map(b=>`<button class="c" style="text-align:left;color:var(--tx)" data-a="gob" data-v="${b.id}"><span class="live">${cn(b.category)} · ${b.status.toUpperCase()}</span><b>${esc(b.title)}</b></button>`).join('')||`<div class="m">${t('No results')}</div>`)))}
let qt;async function doSearch(){const q=S.q.trim();if(!q){S.sr=null;return render()}const like='%'+q.replace(/[%_]/g,'')+'%';
const[u,p,b]=await Promise.all([SB.from('profiles').select('id,name').ilike('name',like).limit(10),SB.from('posts').select('*,profiles!posts_user_id_fkey(name)').ilike('title',like).order('created_at',{ascending:false}).limit(10),SB.from('battles').select('*,profiles!battles_host_id_fkey(name)').ilike('title',like).limit(10)]);
S.sr={users:u.data||[],posts:p.data||[],battles:b.data||[]};await hydrate(S.sr.posts);render()}
/* battles */
function blist(){return `<button class="btn" data-a="newb">+ ${t('Create battle')}</button>`+(S.battles.length?S.battles.map(b=>{const en=S.ent[b.id]||[];return `<button class="c" style="text-align:left;color:var(--tx)" data-a="gob" data-v="${b.id}"><span class="live">● ${cn(b.category)} · ${b.status.toUpperCase()}</span><b>${esc(b.title)}</b><span class="m">${t('Host')}: ${esc(b.profiles&&b.profiles.name)} · ${en.map(e=>esc(e.profiles&&e.profiles.name)).join(' vs ')||t('Waiting for challenger')}</span></button>`}).join(''):`<div class="m">${t('No battles yet. Create the first one.')}</div>`)}
function bdet(b){const en=S.ent[b.id]||[],me=S.user.id,host=b.host_id==me,inn=en.some(e=>e.user_id==me),live=b.status=='live',sel=S.side[b.id]||(en[0]&&en[0].user_id);
const sc=en.map(e=>e.votes+e.boost),tot=sc.reduce((a,x)=>a+x,0)||1,win=en.find(e=>e.user_id==b.winner);
return `<button class="chip" data-a="bback">${t('Back')}</button><div class="c"><span class="live">● ${cn(b.category)} · ${b.status.toUpperCase()} · ${b.mode=='video'?t('Video'):t('Open-mic')}</span><div class="b" style="font-size:16px">${esc(b.title)}</div><div class="m">${t('Host')}: ${esc(b.profiles&&b.profiles.name)} · ${t('Reward pool')}: <b class="gold">${b.pool}</b> · ${t('20% host · 80% battlers')}</div>
${en.length?`<div class="r w">${en.map(e=>`<button class="chip f1 ${sel==e.user_id?'on':''}" data-a="bside" data-v="${e.user_id}">${esc(e.profiles&&e.profiles.name)}<br><b>${e.votes+e.boost}</b></button>`).join('')}</div><div class="meter">${en.map((e,i)=>`<i style="width:${sc[i]/tot*100}%;background:var(--c${i})"></i>`).join('')}</div>`:`<div class="m">${t('Waiting for challenger')}</div>`}
${b.status=='ended'?`<div class="win">${t('Winner')}: ${esc(win&&win.profiles&&win.profiles.name||'-')}</div>`:''}
${!host&&!inn&&en.length<2&&b.status!='ended'?`<button class="btn" data-a="joinb" data-v="${b.id}">${t('Join as contender')}</button>`:''}
${live&&!inn&&!host?`<div class="m">${t('Picks the side you vote for')}</div><div class="r"><button class="chip f1" data-a="bvote" data-v="1">💀 1 V</button><button class="chip f1" data-a="bvote" data-v="1">😂 1 V</button><button class="chip f1" data-a="bvote" data-v="1">🔥 1 V</button></div><div class="r"><button class="btn gd f1" data-a="bvote" data-v="5">${t('SuperVote')} 5 V</button><button class="btn gd f1" data-a="bvote" data-v="10">${t('SuperVote')} 10 V</button></div><button class="btn o" data-a="blike">♥ ${t('Like boost')}</button>`:''}
${b.status!='ended'?`<button class="btn o" data-a="golive" data-v="${b.id}">${t('Watch / go live')}</button>`:''}
${host&&b.status!='ended'?`<button class="btn rd" data-a="endb" data-v="${b.id}">${t('End battle and pay rewards')}</button>`:''}</div>`}
function bat(){const b=S.battles.find(x=>x.id==S.bsel);return b?bdet(b):blist()}
/* dashboard */
function prof(){const m=S.me,mx=m?Math.max(1,...m.days):1;return `<div class="c"><div class="r sp"><b>${t('Welcome')}, ${esc(S.user.name)}</b><button class="chip" data-a="logout">${t('Log out')}</button></div><div class="m">${t('Virtual coins only. No cash value, no withdrawal.')}</div>
<div class="r"><div class="c f1"><span class="m">${t('Voting coins')}</span><b style="font-size:24px">${S.vc}</b></div><div class="c f1"><span class="m">${t('Reward coins')}</span><b class="gold" style="font-size:24px">${S.rc}</b></div></div></div>
<div class="c"><b>${t('Monthly allowance')}</b><button class="btn" data-a="claim" ${S.claimed?'disabled':''}>${S.claimed?t('Already claimed this month'):t('Claim +100 voting coins')}</button></div>
${m?`<div class="c"><b>${t('Dashboard')}</b><div class="r sp"><span>${t('Coins earned')}</span><b class="gold">${m.earned} R</b></div><div class="r sp"><span>${t('Content unlocks')}</span><b>${m.unlocks}</b></div><div class="r sp"><span>${t('Battle performance')}</span><b>${m.played} ${t('Played')} · ${m.wins} ${t('Wins')}</b></div><div class="r sp"><span>${t('Followers')}</span><b>${m.followers}</b></div><div class="m">${t('Follower growth (7 days)')}</div><div class="bars">${m.days.map(v=>`<i style="height:${v/mx*100}%"></i>`).join('')}</div></div>
<div class="c"><b>${t('Sales from unlocks')}</b>${m.hist.filter(x=>/^Unlock:/.test(x.description)).slice(0,6).map(x=>`<div class="r sp"><span>${esc(x.description.slice(8))}</span><b class="gold">+${x.coins} R</b></div>`).join('')||`<div class="m">${t('No rewards yet.')}</div>`}</div>
<div class="c"><b>${t('Reward history')}</b>${m.hist.slice(0,10).map(x=>`<div class="r sp"><span>${esc(x.description)}</span><b class="gold">+${x.coins} R</b></div>`).join('')||`<div class="m">${t('No rewards yet.')}</div>`}</div>`:''}
<div class="c"><b>${t('My content')}</b>${S.posts.filter(p=>p.user_id==S.user.id).map(p=>`<div class="r sp"><span>${esc(p.title)}</span><select data-a="gate" data-v="${p.id}" style="width:150px"><option value="free" ${p.gate=='free'?'selected':''}>${t('Free')}</option><option value="paid" ${p.gate=='paid'?'selected':''}>${p.price} V</option><option value="follow" ${p.gate=='follow'?'selected':''}>${t('Follow-to-unlock')}</option></select></div>`).join('')||'—'}</div>
<div class="c"><b>${t('Language')}</b><div class="r"><button class="chip ${S.lang=='en'?'on':''}" data-a="lang" data-v="en">English</button><button class="chip ${S.lang=='fr'?'on':''}" data-a="lang" data-v="fr">Français</button></div></div>`}
function render(){const ae=document.activeElement,id=ae&&ae.id,val=ae&&ae.value,ss=ae&&ae.selectionStart;hdr();$('#v').innerHTML=!S.user?auth():{b:bat,f:feed,d:disc,p:prof}[S.tab]();
if(id){const e=document.getElementById(id);if(e&&(e.tagName=='INPUT'||e.tagName=='TEXTAREA')){e.value=val;e.focus();try{e.setSelectionRange(ss,ss)}catch(x){}}}}
const modal=h=>$('#ovl').innerHTML=`<div class="ov"><div class="c">${h}<button class="btn o" data-a="close">${t('Close')}</button></div></div>`;
/* LiveKit: live video / audio inside a battle */
let lk=null;const lkBox=document.createElement('div');lkBox.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:6px';let lkState={mic:true,cam:true};
async function liveJoin(bid){const LK=window.LivekitClient;if(!LK||!CFG.LIVEKIT_URL)return toast('Set LIVEKIT_URL in config.js');
$('#ovl').innerHTML=`<div class="ov"><div class="c"><b>Live</b><div id="lkslot"></div><div class="r w"><button class="chip" data-a="lmic">${t('Mute')} / ${t('Unmute')}</button><button class="chip" data-a="lcam">${t('Camera')}</button><button class="btn rd" data-a="lleave">${t('Leave')}</button></div></div></div>`;$('#lkslot').appendChild(lkBox);
try{const ses=(await SB.auth.getSession()).data.session,r=await fetch('/api/livekit-token?battle='+encodeURIComponent(bid),{headers:{Authorization:'Bearer '+ses.access_token}}),j=await r.json();if(!r.ok)throw new Error(j.error||'token');
lk=new LK.Room();lk.on(LK.RoomEvent.TrackSubscribed,tr=>{const el=tr.attach();el.style.width='100%';lkBox.appendChild(el)});lk.on(LK.RoomEvent.TrackUnsubscribed,tr=>tr.detach().forEach(e=>e.remove()));await lk.connect(CFG.LIVEKIT_URL,j.token);
if(j.canPublish){await lk.localParticipant.setMicrophoneEnabled(true);lkState={mic:true,cam:false};const b=S.battles.find(x=>x.id==bid);if(b&&b.mode=='video'){await lk.localParticipant.setCameraEnabled(true);lkState.cam=true;const p=lk.localParticipant.getTrackPublication(LK.Track.Source.Camera);if(p&&p.track){const el=p.track.attach();el.muted=true;el.style.width='100%';lkBox.prepend(el)}}}toast(t('Connected'))}catch(e){toast('Live error: '+e.message)}}
/* actions */
const A={lang:v=>{S.lang=typeof v=='string'&&v?v:(S.lang=='en'?'fr':'en');try{localStorage.setItem('arena-lang',S.lang)}catch(e){}document.documentElement.lang=S.lang;render()},
at:v=>{S.authTab=v;render()},
authgo:async()=>{const su=S.authTab=='signup',n=su?$('#an').value.trim():'',e=$('#ae').value.trim(),p=$('#ap').value;if(!e||!p||(su&&!n))return toast(t('Fill all fields'));if(!/^\S+@\S+\.\S+$/.test(e))return toast(t('Invalid email'));if(p.length<6)return toast(t('Password needs 6+ characters'));
const r=su?await SB.auth.signUp({email:e,password:p,options:{data:{name:n}}}):await SB.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message);if(su&&!r.data.session)toast(t('Confirm email sent. Check your inbox, then log in.'))},
social:v=>{SB.auth.signInWithOAuth({provider:v.toLowerCase(),options:{redirectTo:location.origin}})},
logout:async()=>{await SB.auth.signOut();S.user=null;S.posts=[];S.battles=[];S.me=null;S.sr=null;render()},
tab:async v=>{S.tab=v;S.bsel=null;render();if(v=='p'){await loadMe();render()}if(v=='b'){await loadBattles();render()}if(v=='f'){await loadFeed();render()}},
close:()=>{$('#ovl').innerHTML=''},refresh:async()=>{await loadSocial();await loadFeed();render()},
up:()=>modal(`<b>${t('Upload')}</b><input id="uf" type="file" accept="image/*,video/*"><input id="ut" maxlength="120" placeholder="${t('Title')}"><textarea id="ud" rows="2" maxlength="500" placeholder="${t('Description')}"></textarea><select id="ug"><option value="free">${t('Free download')}</option><option value="paid">${t('Paid')} · 5 V</option><option value="follow">${t('Follow-to-unlock')}</option></select><button class="btn" id="ub" data-a="upok">${t('Post')}</button>`),
upok:async()=>{if(S.busy)return;const f=$('#uf').files[0],ti=$('#ut').value.trim();if(!f||!ti)return toast(t('Choose a file and a title'));if(f.size>50*1024*1024)return toast(t('File too large (max 50 MB)'));const k=f.type.startsWith('video')?'video':f.type.startsWith('image')?'photo':null;if(!k)return toast(t('Photo or video only'));
S.busy=1;$('#ub').disabled=true;toast(t('Uploading...'));const path=S.user.id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
const up=await SB.storage.from('media').upload(path,f,{contentType:f.type});if(up.error){S.busy=0;if($('#ub'))$('#ub').disabled=false;return toast(up.error.message)}
const ins=await SB.from('posts').insert({user_id:S.user.id,kind:k,title:ti,description:$('#ud').value.trim(),gate:$('#ug').value,price:5,file_path:path});S.busy=0;if(ins.error){await SB.storage.from('media').remove([path]);if($('#ub'))$('#ub').disabled=false;return toast(ins.error.message)}
A.close();await loadFeed();render();toast(t('Published'))},
like:async v=>{const l=S.likes[v]||[],has=l.includes(S.user.id);const r=has?await SB.from('likes').delete().eq('post_id',v).eq('user_id',S.user.id):await SB.from('likes').insert({post_id:v,user_id:S.user.id});if(r.error)return toast(r.error.message);S.likes[v]=has?l.filter(x=>x!=S.user.id):l.concat(S.user.id);render()},
fol:async v=>{const has=S.fol[v];const r=has?await SB.from('follows').delete().eq('follower',S.user.id).eq('followee',v):await SB.from('follows').insert({follower:S.user.id,followee:v});if(r.error)return toast(r.error.message);if(has)delete S.fol[v];else S.fol[v]=1;await hydrate(allPosts());render()},
unlock:async v=>{const{error}=await SB.rpc('unlock_post',{p_post:v});if(error)return toast(emsg(error));S.unl[v]=1;await loadProfile();await hydrate(allPosts());render()},
dl:async v=>{const p=allPosts().find(x=>x.id==v);if(!p||!canView(p))return toast(t('Locked'));const{data,error}=await SB.storage.from('media').createSignedUrl(p.file_path,120,{download:true});if(error)return toast(error.message);const a=document.createElement('a');a.href=data.signedUrl;a.download=p.title;document.body.appendChild(a);a.click();a.remove()},
cmt:async v=>{const i=$('#ci-'+v),b=i&&i.value.trim();if(!b)return;const{error}=await SB.from('comments').insert({post_id:v,user_id:S.user.id,body:b});if(error)return toast(error.message);i.value='';await hydrate(allPosts().filter(p=>p.id==v));render()},
delc:async v=>{const{error}=await SB.from('comments').delete().eq('id',v);if(error)return toast(error.message);await hydrate(allPosts());render()},
delpost:async v=>{const p=S.posts.find(x=>x.id==v);if(!p||!confirm('Delete this post?'))return;const{error}=await SB.from('posts').delete().eq('id',v);if(error)return toast(error.message);await SB.storage.from('media').remove([p.file_path]);S.posts=S.posts.filter(x=>x.id!=v);render();toast(t('Deleted'))},
gate:async(v,e)=>{const{error}=await SB.from('posts').update({gate:e.value,price:5}).eq('id',v);if(error)return toast(error.message);await loadFeed();render()},
q:(v,e)=>{S.q=e.value;clearTimeout(qt);qt=setTimeout(doSearch,350)},
gob:async v=>{S.tab='b';S.bsel=v;await loadBattles();render()},bback:()=>{S.bsel=null;render()},bside:v=>{S.side[S.bsel]=v;render()},
newb:()=>modal(`<b>${t('Create battle')}</b><input id="nt" maxlength="120" placeholder="${t('Title')}"><select id="nc">${CAT.map(c=>`<option value="${c[0]}">${t(c[1])}</option>`).join('')}</select><select id="nm"><option value="video">${t('Video')}</option><option value="audio">${t('Open-mic')}</option></select><button class="btn" data-a="mkb">${t('Create')}</button>`),
mkb:async()=>{const ti=$('#nt').value.trim();if(!ti)return toast(t('Fill all fields'));const{data,error}=await SB.rpc('create_battle',{p_title:ti,p_cat:$('#nc').value,p_mode:$('#nm').value});if(error)return toast(emsg(error));A.close();S.bsel=data;await loadBattles();render();toast(t('Battle created'))},
joinb:async v=>{const{error}=await SB.rpc('join_battle',{p_battle:v});if(error)return toast(emsg(error));await loadBattles();render();toast(t('Joined'))},
bvote:async v=>{const en=S.ent[S.bsel]||[],tg=S.side[S.bsel]||(en[0]&&en[0].user_id);if(!tg)return;const{error}=await SB.rpc('cast_vote',{p_battle:S.bsel,p_target:tg,n:+v});if(error)return toast(emsg(error));await loadProfile();await loadBattles();render()},
blike:async()=>{const en=S.ent[S.bsel]||[],tg=S.side[S.bsel]||(en[0]&&en[0].user_id);const{error}=await SB.rpc('like_battle',{p_battle:S.bsel,p_target:tg});if(error)return toast(emsg(error));await loadBattles();render()},
endb:async v=>{if(!confirm('End this battle and pay rewards?'))return;const{error}=await SB.rpc('end_battle',{p_battle:v});if(error)return toast(emsg(error));await loadProfile();await loadBattles();render();toast(t('Rewards paid'))},
golive:v=>liveJoin(v),lmic:()=>{lkState.mic=!lkState.mic;if(lk)lk.localParticipant.setMicrophoneEnabled(lkState.mic)},lcam:()=>{lkState.cam=!lkState.cam;if(lk)lk.localParticipant.setCameraEnabled(lkState.cam)},
lleave:()=>{if(lk){lk.disconnect();lk=null}lkBox.innerHTML='';A.close()},
claim:async()=>{if(S.claimed)return;const{data,error}=await SB.rpc('claim_monthly');if(error)return toast(emsg(error));S.vc=data;S.claimed=1;render();toast('+100 V')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||['INPUT','SELECT'].includes(el.tagName))return;const f=A[el.dataset.a];if(f)f(el.dataset.v,el)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.a=='q')A.q(0,e.target)});
document.addEventListener('change',e=>{const el=e.target;if(el.tagName=='SELECT'&&el.dataset.a&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el)});
/* keep shared data fresh every 6s (skipped while typing or a pop-up is open) */
setInterval(async()=>{if(!S.user||document.hidden||$('#ovl').firstChild||(document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName)))return;
if(S.tab=='b'){const o=JSON.stringify([S.battles,S.ent]);await loadBattles();if(o!=JSON.stringify([S.battles,S.ent]))render()}
else if(S.tab=='f'){const o=JSON.stringify([S.posts.map(p=>p.id),S.cmts,S.likes]);await loadFeed();if(o!=JSON.stringify([S.posts.map(p=>p.id),S.cmts,S.likes]))render()}},6000);
document.documentElement.lang=S.lang;render();
if(SB){SB.auth.getSession().then(({data})=>{if(data.session)boot()});SB.auth.onAuthStateChange((ev,ses)=>{if(ev=='SIGNED_IN'&&ses&&!(S.user&&S.user.id==ses.user.id))boot()})}
</script></body></html>
