*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.side canvas{width:100%;height:100%;position:absolute;inset:0}
.side .lb{position:absolute;left:8px;bottom:6px;right:8px;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 1px 3px #000}
.side .bd{position:absolute;left:8px;top:6px;font-size:10px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:4px}
.wave{position:absolute;inset:0 0 28px;display:flex;align-items:center;justify-content:center;gap:3px}.wave s{width:4px;background:#fff;border-radius:2px;animation:wv 1s ease-in-out infinite alternate}@keyframes wv{from{height:6px}to{height:56px}}
.meter{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--ln)}.meter i{display:block;transition:width .4s}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.ov>.c{width:100%;max-width:440px;max-height:92%;overflow:auto}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:9px 14px;border-radius:999px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center}
.msg{max-width:82%;padding:8px 11px;border-radius:12px;background:var(--ln);text-align:left;border:0;color:var(--tx)}.msg.me{align-self:flex-end;background:var(--ink);color:var(--on)}
.thumb{width:100%;height:130px;border-radius:8px;object-fit:cover;display:block}
.pv{position:relative;border-radius:8px;overflow:hidden;background:#27272A;color:#fff;height:130px}.pv canvas,.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.pv.lk canvas,.pv.lk img{filter:blur(7px)}.pv span{position:absolute;left:8px;bottom:6px;font-size:12px;text-shadow:0 1px 3px #000;font-weight:700}
.tile{aspect-ratio:4/3;border-radius:10px;background:#27272A;position:relative;overflow:hidden;color:#fff}.tile.spk{outline:3px solid var(--grn)}.tile canvas{position:absolute;inset:0;width:100%;height:100%}.tile span{position:absolute;left:6px;bottom:4px;font-size:12px;text-shadow:0 1px 3px #000}
.bars{display:flex;align-items:flex-end;gap:6px;height:60px}.bars i{flex:1;background:var(--ink);border-radius:3px 3px 0 0;min-height:3px}
.auth{max-width:420px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:12px}

const mk=(c,title,mode,host,ents,t0,x)=>Object.assign({c,title,mode,host,e:ents.map(n=>({n,p:0,v:0})),pool:0,t:t0,round:1,rounds:3,likes:0,liked:0,j:[],jp:[],jm:'aud',unlock:-1},x||{});

S.B.forEach(b=>{seed(b);autoJ(b)});
function cmb(b){const s=sum(b);return b.e.map((x,i)=>{const pu=x.p/s*100;if(!b.j.length)return pu;return .5*(b.jp.filter(k=>k==i).length/b.j.length*100)+.5*pu})}
const leader=b=>{const c=cmb(b);return c.indexOf(Math.max(...c))};

const hue=s=>(s*67)%360;

function drawV(cv,tm){const s=+cv.dataset.s||1,w=cv.width=220,h=cv.height=150,x=cv.getContext('2d'),H=hue(s),g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsl(${H},55%,30%)`);g.addColorStop(1,`hsl(${H+70},60%,12%)`);x.fillStyle=g;x.fillRect(0,0,w,h);

const cx=w/2+Math.sin(tm*2+s)*35,by=h-40,sw=Math.sin(tm*6+s)*18;x.strokeStyle='#fff';x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(cx,by-62,10,0,7);x.moveTo(cx,by-50);x.lineTo(cx,by-18);x.moveTo(cx,by-44);x.lineTo(cx-20,by-30+sw);x.moveTo(cx,by-44);x.lineTo(cx+20,by-30-sw);x.moveTo(cx,by-18);x.lineTo(cx-12,by+14+sw/2);x.moveTo(cx,by-18);x.lineTo(cx+12,by+14-sw/2);x.stroke()}

jpick:()=>{const b=cur();S.jsel=b.j.filter(j=>S.aud.includes(j));modal(`<b>${t('Pick judges from audience')}</b><div class="r w">${S.aud.map(a=>`<button class="chip ${S.jsel.includes(a)?'on':''}" data-a="jt" data-v="${a}">${a}</button>`).join('')}</div><button class="btn" data-a="jok">${t('Confirm')}</button>`)},
jt:v=>{const j=S.jsel,i=j.indexOf(v);if(i<0){if(j.length<3)j.push(v)}else j.splice(i,1);$$('.ov .chip[data-v]').forEach(e=>e.classList.toggle('on',j.includes(e.dataset.v)))},
jok:()=>{const b=cur();if(S.jsel.length!=3)return toast(t('Select exactly 3 judges'));b.jm='aud';b.j=S.jsel.slice();b.jp=b.j.map(()=>Math.floor(Math.random()*b.e.length));A.close();$('#bd').innerHTML=bd()},
jauto:()=>{autoJ(cur(),'aud');$('#bd').innerHTML=bd()},jai:()=>{autoJ(cur(),'ai');$('#bd').innerHTML=bd()},jset:v=>{const[k,i]=v.split(':');cur().jp[k]=+i;$('#bd').innerHTML=bd()},
score:()=>{const b=cur(),cm=cmb(b),L=leader(b);modal(`<b>AI Judge · ${t('Verdict')}</b>${['Rhymes & Wordplay','Flow & Delivery','Crowd Reaction','Rebuttal Sharpness'].map(k=>`<div class="r sp"><span>${k}</span><span>${b.e.map((x,i)=>(6+Math.random()*4-(i==L?0:1)).toFixed(1)).join(' / ')}</span></div>`).join('')}<div class="win">${esc(b.e[L].n)} (${cm[L].toFixed(0)}%)</div><div class="m">${b.e.map(x=>esc(x.n)).join(' / ')}</div>`)},
newb:()=>modal(`<b>${t('Create battle')}</b><select id="nc">${CAT.slice(0,5).map(c=>`<option value="${c[0]}">${t(c[1])}</option>`).join('')}</select><select id="nm"><option value="video">${t('Video')}</option><option value="audio">${t('Open-mic')}</option></select><input id="nr" type="number" value="3" min="1" max="9"><div class="m">${t('Host')}: You</div><button class="btn" data-a="mkb">${t('Create')}</button>`),
mkb:()=>{const b=mk($('#nc').value,'Your battle · open slot','video','You',['Challenger A','Challenger B'],60);b.mode=$('#nm').value;b.rounds=Math.max(1,Math.min(9,+$('#nr').value||3));seed(b);autoJ(b);S.B.unshift(b);S.sel=0;A.close();render()},
close:()=>{$('#ovl').innerHTML=S.call?'':'';if(S.call)callUI()},
mf:v=>{S.mf=v;render()},
fol:v=>{S.fol[v]=!S.fol[v];toast(S.fol[v]?t('Following')+' '+v:v);render()},
unlock:v=>{const x=S.media.find(i=>i.id==v);if(unlocked(x))return;if(!payUnlock(x.price))return;S.own[v]=1;toast('Unlocked −'+x.price);render()},
dl:v=>{const x=S.media.find(i=>i.id==v);if(!unlocked(x))return toast(t('Follow to unlock'));S.dld[v]=1;toast(t('Downloaded')+' (simulated)');render()},
up:()=>modal(`<b>${t('Upload')}</b><input id="ut" placeholder="${t('Title')}"><textarea id="ud" rows="2" placeholder="${t('Description')}"></textarea><select id="uk"><option value="video">${t('Video')}</option><option value="photo">Photo</option></select><select id="ug"><option value="free">${t('Free download')}</option><option value="paid">${t('Paid')} · 5 V</option><option value="follow">${t('Follow-to-unlock')}</option></select><button class="btn" data-a="upok">${t('Upload')}</button>`),
upok:()=>{const ti=$('#ut').value.trim();if(!ti)return toast(t('Fill all fields'));S.media.unshift({id:Date.now()%100000,k:$('#uk').value,t:ti,by:S.user.name,d:$('#ud').value||'',g:$('#ug').value,price:5,mine:1});A.close();S.tab='m';render()},
gate:(v,e)=>{const x=S.media.find(i=>i.id==v);x.g=e.value;x.price=5},
oc:v=>{S.chat=+v;S.msel=null;render()},cback:()=>{S.chat=null;render()},msel:v=>{S.msel=S.msel===+v?null:+v;render()},
react:v=>{const[i,e]=v.split(':'),m=S.chats[S.chat].m[i];m.r=m.r||{};m.r[e]=(m.r[e]||0)+1;render()},
send:()=>{const i=$('#mi'),x=i.value.trim();if(x)send({t:x})},att:v=>{send({t:'',f:v});if(!S.docs.includes(v))S.docs.push(v)},chal:()=>send({ch:1}),
acc:v=>{S.chats[S.chat].m[v].acc=1;const n=S.chats[S.chat].n,b=mk('roast','Rematch · '+n,'video','DJ Prisma',['You',n],60);S.B.unshift(b);seed(b);autoJ(b);S.sel=0;toast('Rematch battle created in Battles');render()},
doc:v=>modal(`<b>${esc(v)}</b><div>${esc(DOCS[v]||'')}</div><button class="btn o" data-a="fdl" data-v="${esc(v)}">${t('Download')}</button>`),fdl:v=>toast('Downloading '+v+' (simulated)'),
vault:()=>modal(`<b>${t('Documents vault')}</b>${S.docs.map(d=>`<button class="chip" data-a="doc" data-v="${esc(d)}">${esc(d)}</button>`).join('')||`<div class="m">${t('Empty. Share a file in a chat.')}</div>`}`),
rec:()=>{S.rec=Date.now();render()},stoprec:()=>{const s=Math.max(1,Math.floor((Date.now()-S.rec)/1000));S.rec=null;send({voice:s})},
call:v=>{const c=S.chats[S.chat];S.call={n:c.n,v:+v,mute:0,cam:1,doc:0,chat:0,notes:[],t0:Date.now(),p:c.g?['You','Kai Skater','Mira Cole','Dex Volt']:['You',c.n]};callUI();if(LKON())lkJoin()},
mute:()=>{S.call.mute=!S.call.mute;if(lk)lk.localParticipant.setMicrophoneEnabled(!S.call.mute);callUI()},cam:()=>{S.call.cam=!S.call.cam;if(lk)lk.localParticipant.setCameraEnabled(!!S.call.cam);callUI()},cdoc:()=>{S.call.doc=!S.call.doc;callUI()},cch:()=>{S.call.chat=!S.call.chat;callUI()},end:()=>{if(lk){lk.disconnect();lk=null;lkBox.innerHTML=''}S.call=null;callUI()},
cnote:()=>{const i=$('#cn');if(i&&i.value.trim()){S.call.notes.push('You: '+i.value);callUI()}},
sj:v=>{const s=S.squads[v];s.j=!s.j;s.role=s.j?'member':'';render()},sc:v=>{const n=S.squads[v].n;let i=S.chats.findIndex(c=>c.n==n);if(i<0){S.chats.push({n,g:1,m:[{w:1,t:'Welcome to the squad.',st:3}]});i=S.chats.length-1}S.tab='c';S.chat=i;render()},sg:v=>{A.sc(v);A.call(1)},
mksq:()=>{const n=$('#sn').value.trim();if(!n)return toast(t('Fill all fields'));S.squads.unshift({n,s:'New squad',mem:1,role:'admin',j:1});render()},
q:(v,e)=>{S.q=e.value;render()},sf:v=>{S.sf=v;render()},gob:v=>{S.sel=+v;S.tab='b';render()},
ps:v=>{S.status=v;render()},claim:()=>{if(S.claimed)return;if(SB){SB.rpc('claim_monthly').then(({data,error})=>{if(error)return toast(error.message);S.vc=data;S.claimed=1;render();toast('+100 V')});return}S.claimed=1;S.vc+=100;render();toast('+100 V')},nextm:()=>{if(SB)return toast('Demo only: the real refill happens each month.');S.claimed=0;render()}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName=='INPUT'||el.tagName=='SELECT')return;const f=A[el.dataset.a];if(f)f(el.dataset.v,el)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.a=='q')A.q(0,e.target)});
document.addEventListener('change',e=>{const el=e.target;if(el.tagName=='SELECT'&&el.dataset.a&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el)});
document.documentElement.lang=S.lang;render();
if(SB){SB.auth.getSession().then(({data})=>{if(data.session)loadProfile(data.session.user)});SB.auth.onAuthStateChange((ev,ses)=>{if(ev=='SIGNED_IN'&&ses&&!(S.user&&S.user.id==ses.user.id))loadProfile(ses.user)})}
</script></body></html>
